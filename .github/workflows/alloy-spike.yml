name: alloy-v1 spike (Issue #293)

# Verifies the alloy 1.8.3 API surface for the future `eth-wallet-core` crate
# (PR #294). Runs V1/V2/V4/V5/V6/V7 in CI (deterministic + anvil-backed).
#
# V3 (live RPC against https://ethereum.reth.rs/rpc) stays `#[ignore]`
# operator-only per L29. Run locally:
#   RUN_V3_LIVE_RPC=1 cargo test --test v3_live_rpc -- --ignored --nocapture

on:
  push:
    branches: [main, eth-v1-spike-293]
    paths:
      - 'rust-wallet-app/spikes/alloy-v1/**'
      - '.github/workflows/alloy-spike.yml'
  pull_request:
    paths:
      - 'rust-wallet-app/spikes/alloy-v1/**'
      - '.github/workflows/alloy-spike.yml'

permissions:
  contents: read

concurrency:
  group: alloy-spike-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: alloy-v1 spike (V1/V2/V4/V5/V6/V7 with anvil for V4+V6)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # L37 hygiene: pin to immutable tag commit SHAs. Dependabot
      # (`.github/dependabot.yml`, github-actions ecosystem, weekly cadence)
      # opens PRs that bump the SHA when upstream publishes a new tag/commit.
      #
      #   actions/checkout@v4.4.0     → 11d5960a326750d5838078e36cf38b85af677262 (immutable tag)
      #   dtolnay/rust-toolchain@1.94.0 → 35d8a35b823d6c20db516f5c35eb0a9640942c17
      #     NOTE: dtolnay/rust-toolchain has no `1.94.0` git tag (only `v1`);
      #     this is the 1.94.0 version-named branch HEAD (mutable in theory,
      #     but the maintainer only pushes 1.94.x patch commits — Dependabot
      #     bumps the SHA automatically).
      #   Swatinem/rust-cache@v2.7.3   → 23bce251a8cd2ffc3c1075eaa2367cf899916d84 (immutable tag)
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust 1.94 stable + rustfmt + clippy
        uses: dtolnay/rust-toolchain@35d8a35b823d6c20db516f5c35eb0a9640942c17 # 1.94.0
        with:
          toolchain: 1.94
          components: rustfmt, clippy

      # Cache cargo registry only (NOT target). Per cache-restores-prebuilt-artifacts
      # security review: caching the compiled `target/` would let prior-runners'
      # build artifacts land in fresh runs. Cargo registry cache is safe (it's just
      # downloaded crate source).
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84 # v2.7.3
        with:
          workspaces: rust-wallet-app/spikes/alloy-v1 -> target
          cache-on-failure: false

      # Foundry (anvil + cast) — install prebuilt nightly tarball.
      # Foundry does NOT publish per-commit assets or SHA256SUMS files; the only
      # immutable pin is the SHA of the tarball that was verified-good at commit
      # time. Trade-off acknowledged: rolling `nightly` tag is mutable, but the
      # pinned SHA + fail-closed check (`set -e` + no soft-fail branch) prevents
      # silent degradation. To refresh the pin when foundry ships a new nightly:
      #   curl -fsSL -o /tmp/foundry.tar.gz \
      #     "https://github.com/foundry-rs/foundry/releases/download/nightly/foundry_nightly_linux_amd64.tar.gz"
      #   sha256sum /tmp/foundry.tar.gz
      # Then update FOUNDRY_SHA256_LINUX_AMD64 below.
      - name: Install Foundry (anvil + cast)
        env:
          FOUNDRY_TARBALL: foundry_nightly_linux_amd64.tar.gz
          FOUNDRY_SHA256_LINUX_AMD64: 71ff4cb01b295557267b7f5775d185efd74d838599fa122e7cd7aa0272d580d4
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.foundry"
          curl -fsSL -o /tmp/foundry.tar.gz \
            "https://github.com/foundry-rs/foundry/releases/download/nightly/${FOUNDRY_TARBALL}"
          # Fail-closed SHA256 verify (no warn-and-continue branch per L37).
          echo "${FOUNDRY_SHA256_LINUX_AMD64}  /tmp/foundry.tar.gz" | sha256sum -c -
          tar -xzf /tmp/foundry.tar.gz -C "${HOME}/.foundry" anvil cast
          # GITHUB_PATH only applies to SUBSEQUENT steps; verify install
          # in-step by prepending PATH explicitly.
          "${HOME}/.foundry/anvil" --version
          echo "${HOME}/.foundry" >> "${GITHUB_PATH}"

      - name: V1 — compile (alloy 1.8.3 + sub-crates + bip32/bip39/reqwest/rustls/tokio/sha2/subtle/hex)
        working-directory: rust-wallet-app/spikes/alloy-v1
        run: cargo check --all-targets

      - name: cargo fmt --check
        working-directory: rust-wallet-app/spikes/alloy-v1
        run: cargo fmt --check

      - name: cargo clippy --all-targets -- -D warnings
        working-directory: rust-wallet-app/spikes/alloy-v1
        run: cargo clippy --all-targets -- -D warnings

      - name: V2 — MnemonicBuilder → canonical ETH address (deterministic)
        working-directory: rust-wallet-app/spikes/alloy-v1
        run: cargo test --test v2_mnemonic -- --nocapture

      - name: V4 — Anvil send_signed_native_eth_tx (with foundry)
        working-directory: rust-wallet-app/spikes/alloy-v1
        env:
          RUN_V4_ANVIL: '1'
        run: cargo test --test v4_anvil_send -- --ignored --nocapture

      - name: V5 — ERC-20 transferCall calldata → 0xa9059cbb (deterministic)
        working-directory: rust-wallet-app/spikes/alloy-v1
        run: cargo test --test v5_erc20_calldata -- --nocapture

      - name: V6 — Anvil MockERC20 sol! + constructor calldata (with foundry)
        working-directory: rust-wallet-app/spikes/alloy-v1
        env:
          RUN_V6_ANVIL: '1'
        run: cargo test --test v6_erc20_anvil -- --ignored --nocapture

      - name: V7 — SPKI pin accept/reject (deterministic, constant-time compare)
        working-directory: rust-wallet-app/spikes/alloy-v1
        run: cargo test --test v7_spki_pin -- --nocapture

      # V3 (live RPC against https://ethereum.reth.rs/rpc) intentionally NOT run in CI
      # per L29 (operator-driven). Run locally:
      #   RUN_V3_LIVE_RPC=1 cargo test --test v3_live_rpc -- --ignored --nocapture