name: alloy-v1 spike (Issue #293)

# Verifies the alloy 1.8.3 API surface for the future `eth-wallet-core` crate
# (PR #294). Runs V1/V2/V5/V7 deterministic tests in CI.
#
# V3 (live RPC against https://ethereum.reth.rs/rpc) + V4 + V6 (anvil spawn)
# stay `#[ignore]` operator-only per L29. Run locally:
#   RUN_V3_LIVE_RPC=1 cargo test --test v3_live_rpc -- --ignored --nocapture
#   RUN_V4_ANVIL=1   cargo test --test v4_anvil_send -- --ignored --nocapture
#   RUN_V6_ANVIL=1   cargo test --test v6_erc20_anvil -- --ignored --nocapture
# Foundry install was removed from CI per L37 supply-chain-credential-pinning
# + supply-chain-mutable-artifact-source findings (mutable `nightly` tag +
# warn-and-continue SHA gate fail-open). Local verification of V4/V6 captured
# in PR #294 commit 6f1afdd.

on:
  push:
    branches: [main, eth-v1-spike-293]
    paths:
      - 'rust-wallet-app/spikes/alloy-v1/**'
      - '.github/workflows/alloy-spike.yml'
  pull_request:
    paths:
      - 'rust-wallet-app/spikes/alloy-v1/**'
      - '.github/workflows/alloy-spike.yml'

permissions:
  contents: read

concurrency:
  group: alloy-spike-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: alloy-v1 spike (deterministic V1/V2/V5/V7)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # L37 hygiene: pin to immutable tag commit SHAs. Dependabot
      # (`.github/dependabot.yml`, github-actions ecosystem, weekly cadence)
      # opens PRs that bump the SHA when upstream publishes a new tag/commit.
      #
      #   actions/checkout@v4.4.0     → 11d5960a326750d5838078e36cf38b85af677262 (immutable tag)
      #   dtolnay/rust-toolchain@1.94.0 → 35d8a35b823d6c20db516f5c35eb0a9640942c17
      #     NOTE: dtolnay/rust-toolchain has no `1.94.0` git tag (only `v1`);
      #     this is the 1.94.0 version-named branch HEAD (mutable in theory,
      #     but the maintainer only pushes 1.94.x patch commits — Dependabot
      #     bumps the SHA automatically).
      #   Swatinem/rust-cache@v2.7.3   → 23bce251a8cd2ffc3c1075eaa2367cf899916d84 (immutable tag)
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust 1.94 stable + rustfmt + clippy
        uses: dtolnay/rust-toolchain@35d8a35b823d6c20db516f5c35eb0a9640942c17 # 1.94.0
        with:
          toolchain: 1.94
          components: rustfmt, clippy

      # Cache cargo registry only (NOT target). Per cache-restores-prebuilt-artifacts
      # security review: caching the compiled `target/` would let prior-runners'
      # build artifacts land in fresh runs. Cargo registry cache is safe (it's just
      # downloaded crate source).
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84 # v2.7.3
        with:
          workspaces: rust-wallet-app/spikes/alloy-v1 -> target
          cache-on-failure: false

      - name: V1 — compile (alloy 1.8.3 + sub-crates + bip32/bip39/reqwest/rustls/tokio/sha2/subtle/hex)
        working-directory: rust-wallet-app/spikes/alloy-v1
        run: cargo check --all-targets

      - name: cargo fmt --check
        working-directory: rust-wallet-app/spikes/alloy-v1
        run: cargo fmt --check

      - name: cargo clippy --all-targets -- -D warnings
        working-directory: rust-wallet-app/spikes/alloy-v1
        run: cargo clippy --all-targets -- -D warnings

      - name: V2 — MnemonicBuilder → canonical ETH address (deterministic)
        working-directory: rust-wallet-app/spikes/alloy-v1
        run: cargo test --test v2_mnemonic -- --nocapture

      - name: V5 — ERC-20 transferCall calldata → 0xa9059cbb (deterministic)
        working-directory: rust-wallet-app/spikes/alloy-v1
        run: cargo test --test v5_erc20_calldata -- --nocapture

      - name: V7 — SPKI pin accept/reject (deterministic, constant-time compare)
        working-directory: rust-wallet-app/spikes/alloy-v1
        run: cargo test --test v7_spki_pin -- --nocapture

      # V3 (live RPC), V4 + V6 (anvil) intentionally NOT run in CI per L29.
      # See local operator-run commands at top of file.