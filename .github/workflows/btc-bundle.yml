name: btc-bundle

# Cross-build release bundle for the `btc` CLI binary. Triggered on
# semver tags (`v*.*.*`). Artifacts are uploaded per-target so the
# `wallet-desktop/` build can fetch the matching arch's `btc` binary
# (Task 1/4/25: BtcExtractor pulls from `assets/btc/<arch>/btc[.exe]`).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bundle:
    name: Build + upload btc-${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4  # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable  # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2  # v2
        with:
          workspaces: rust-wallet-app -> target
          shared-key: ${{ matrix.target }}

      - name: Build btc for target
        working-directory: rust-wallet-app
        run: cargo build --release --target ${{ matrix.target }} -p btc

      # actions/upload-artifact: tag-based (no pinned SHA available at
      # this commit; pin to a verified SHA after first successful CI run).
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-${{ matrix.target }}
          path: rust-wallet-app/target/${{ matrix.target }}/release/btc*
          if-no-files-found: error