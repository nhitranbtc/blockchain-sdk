name: CI

# Triggers: push to main, PR to main, manual workflow_dispatch.
# Note: btc-cli-demo workflow (separate file) runs end-to-end demo scripts.
# Note: Flutter desktop jobs live in wallet-desktop-ci.yml (separate file).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Least-privilege token. CI doesn't push or comment.
permissions:
  contents: read

# Cancel in-progress runs on the same branch — saves CI minutes when
# pushing rapid follow-ups to a PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        working-directory: rust-wallet-app
        run: cargo fmt --all -- --check

  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2
        with:
          workspaces: rust-wallet-app -> target
      - name: cargo clippy
        working-directory: rust-wallet-app
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2
        with:
          workspaces: rust-wallet-app -> target
      - name: cargo build
        working-directory: rust-wallet-app
        run: cargo build --workspace
      - name: cargo test
        working-directory: rust-wallet-app
        run: cargo test --workspace

  # Active branch feat/wallet-desktop/ffi-integration ships bitcoin-wallet-core
  # as a Rust cdylib consumed via dart:ffi. CI gate verifies the cdylib still
  # links before flutter-side changes land. Per F53: build must produce a
  # shared object loadable by dart:ffi DynamicLibrary.open().
  rust-ffi-cdylib:
    name: Rust FFI cdylib
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2
        with:
          workspaces: rust-wallet-app -> target
      - name: Build bitcoin-wallet-core as cdylib
        working-directory: rust-wallet-app
        run: |
          cargo build -p bitcoin-wallet-core
          test -f target/debug/libbitcoin_wallet_core.so \
            && echo "cdylib ok: $(file target/debug/libbitcoin_wallet_core.so)" \
            || (echo "ERROR: cdylib not produced" && exit 1)

  # F53 supply-chain gate: enforce `#![deny(unsafe_code)]` stays enabled in
  # bitcoin-wallet-core/src/lib.rs. cargo-geiger surfaces any unsafe usage
  # (including transitive) that would otherwise bypass the deny lint.
  rust-geiger:
    name: Rust unsafe-code audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2
        with:
          workspaces: rust-wallet-app -> target
      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked
      - name: cargo geiger
        working-directory: rust-wallet-app
        run: cargo geiger --workspace --all-targets --output-format GitHubMarkdown

  # Split from the old combined lint-audit job so deny and audit run in
  # parallel — sample's per-concern shape. Both gates independently enforced.
  rust-deny:
    name: Rust deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny
        working-directory: rust-wallet-app
        run: cargo deny check

  # Transitive dev-deps (rustls-webpki via bitcoind, tokio-tar via
  # testcontainers) without upstream fixes yet. See deny.toml for rationale.
  rust-audit:
    name: Rust audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        working-directory: rust-wallet-app
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2025-0111