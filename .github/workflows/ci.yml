name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pin third-party actions to full commit SHAs per security guidance.
      # Update SHAs via Dependabot (config at .github/dependabot.yml).
      # Format: <sha> # <tag>
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2
        with:
          workspaces: rust-wallet-app -> target
      - name: Format check
        working-directory: rust-wallet-app
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: rust-wallet-app
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        working-directory: rust-wallet-app
        run: cargo build --workspace
      - name: Test
        working-directory: rust-wallet-app
        run: cargo test --workspace
      # L29 + L32: end-to-end demo of Wallet::sync + Wallet::balance
      # against public testnet Esplora. Per L33 the unit tests cover
      # shape; this exercises semantics (live reqwest + bdk scan path).
      # Real network calls — flake risk on CI runner. Future enhancement:
      # split into a separate non-blocking smoke job.
      - name: Demo (sync_demo against live testnet)
        working-directory: rust-wallet-app
        run: cargo run -p bitcoin-wallet-core --example sync_demo
      - name: cargo-deny
        working-directory: rust-wallet-app
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      - name: cargo-audit
        working-directory: rust-wallet-app
        run: |
          cargo install cargo-audit --locked
          cargo audit

  btc-import-demo:
    name: btc wallet import demo script
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # L29: operator-driven smoke test. No network calls (demo uses entropy=0
    # BIP-39 test vectors + temp XDG_DATA_HOME). Runs as a required CI gate
    # rather than the L29-style opt-in — the demo covers all 5 BIP-39 word
    # counts + all 5 networks, so a regression is high-signal.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2
        with:
          workspaces: rust-wallet-app -> target
      - name: btc-import-demo (all 5 BIP-39 word counts × all 5 networks)
        working-directory: rust-wallet-app
        env:
          SKIP_BUILD: "1"
        run: bash scripts/btc-import-demo.sh
