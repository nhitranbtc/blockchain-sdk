name: CI

# Triggers: push to main, PR to main, manual workflow_dispatch.
# Note: btc-cli-demo workflow (separate file) runs end-to-end demo scripts.
# Note: Flutter desktop jobs live in wallet-desktop-ci.yml (separate file).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Least-privilege token. CI doesn't push or comment.
permissions:
  contents: read

# Cancel in-progress runs on the same branch — saves CI minutes when
# pushing rapid follow-ups to a PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable  # stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        working-directory: rust-wallet-app
        run: cargo fmt --all -- --check

  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable  # stable
        with:
          components: clippy
      - name: Install protoc (>=3.12)
        # Required by spikes/tron-v1/build.rs (prost-build compiles vendored core/Tron.proto).
        # Issue #403 deliverable #9. Debian/Ubuntu: protobuf-compiler package ships protoc 3.x.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2  # v2
        with:
          workspaces: rust-wallet-app -> target
      - name: cargo clippy
        working-directory: rust-wallet-app
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable  # stable
      - name: Install protoc (>=3.12)
        # Required by spikes/tron-v1/build.rs (prost-build compiles vendored core/Tron.proto).
        # Issue #403 deliverable #9.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2  # v2
        with:
          workspaces: rust-wallet-app -> target
      - name: cargo build
        working-directory: rust-wallet-app
        run: cargo build --workspace
      - name: cargo test
        working-directory: rust-wallet-app
        run: cargo test --workspace

  # Active branch feat/wallet-desktop/ffi-integration ships bitcoin-wallet-core
  # as a Rust cdylib consumed via dart:ffi. CI gate verifies the cdylib still
  # links before flutter-side changes land. Per F53: build must produce a
  # shared object loadable by dart:ffi DynamicLibrary.open().
  rust-ffi-cdylib:
    name: Rust FFI cdylib
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable  # stable
      - name: Install protoc (>=3.12)
        # Required by spikes/tron-v1/build.rs (prost-build compiles vendored core/Tron.proto).
        # Issue #403 deliverable #9.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2  # v2
        with:
          workspaces: rust-wallet-app -> target
      - name: Build bitcoin-wallet-core as cdylib
        working-directory: rust-wallet-app
        run: |
          cargo build -p bitcoin-wallet-core
          test -f target/debug/libbitcoin_wallet_core.so \
            && echo "cdylib ok: $(file target/debug/libbitcoin_wallet_core.so)" \
            || (echo "ERROR: cdylib not produced" && exit 1)

  # Split from the old combined lint-audit job so deny and audit run in
  # parallel — sample's per-concern shape. Both gates independently enforced.
  rust-deny:
    name: Rust deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable  # stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny
        working-directory: rust-wallet-app
        run: cargo deny check

  # Transitive dev-deps (rustls-webpki via bitcoind, tokio-tar via
  # testcontainers) without upstream fixes yet. See deny.toml for rationale.
  rust-audit:
    name: Rust audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable  # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        working-directory: rust-wallet-app
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2025-0111

  # Unsafe-code audit per CLAUDE.md conventions (`cargo geiger` listed).
  # Mirrors the deny/audit shape used across `rust-evm-core-ci.yml`.
  # Workspace-wide scan; transitive `unsafe` counts are noisy but the
  # trend over time is the signal. rust-cache warms the build + install.
  rust-geiger:
    name: Rust unsafe-code audit (geiger)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable  # stable
      - name: Install protoc (>=3.12)
        # Required by spikes/tron-v1/build.rs (prost-build compiles vendored core/Tron.proto).
        # Issue #403 deliverable #9.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2  # v2
        with:
          workspaces: rust-wallet-app -> target
      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked
      - name: cargo geiger (per crate)
        working-directory: rust-wallet-app
        # `cargo geiger --workspace` rejects virtual manifests (CI run 33290091878).
        # Per-crate scan: cd into each crate dir so geiger treats it as the package
        # root. Dedicated CARGO_TARGET_DIR keeps this job's build artifacts out of
        # the shared rust-cache target (other parallel jobs rely on it) and sidesteps
        # stale target/ Io errors from spikes/ test renames.
        # Audit is advisory (trend monitoring) per the original workflow comment.
        # Crates/* report transitive unsafe counts (ring/aws-lc-rs/etc.) that drown
        # the first-party signal — follow-up issue tracks `--forbid-only` migration
        # to make the audit meaningful.
        # Sink-arg hygiene (push security review for run 33290091878): sanitize
        # $crate_dir for ::group:: title, [[ -d ]] guard, no ::warning:: injection
        # surface.
        run: |
          for crate_dir in crates/*/; do
            [[ -d "$crate_dir" ]] || continue
            safe="${crate_dir//$'\n'/ }"
            safe="${safe//$'\r'/ }"
            safe="${safe//::/:}"
            echo "::group::$safe"
            (cd "$crate_dir" && CARGO_TARGET_DIR=/tmp/geiger-target cargo geiger) || true
            echo "::endgroup::"
          done