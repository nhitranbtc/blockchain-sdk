name: polygon-phase-8

# CI for the `task/polygon-full-scenario/8-amoy-gap-fill` parent branch
# (issue #518 / P8-T-setup, parent #510). Per L25 sub-task workflow,
# each Phase 8 child branch (`8-amoy-gap-fill/<n>-<slug>`) PRs into this
# parent branch first; this workflow gates those child PRs at lint +
# compile time. The umbrella `rust-evm-core-ci.yml` does not fire here
# because the parent branch is not `rust-evm-core`.
#
# At v-cut time, the parent branch PRs to `main` (per plan §Branch
# Strategy step 4) where the umbrella `ci.yml` runs the full workspace
# gate.
#
# Per L37 (action-SHA hygiene): actions pinned by tag here mirror the
# umbrella `ci.yml` (`actions/checkout@v4`, `dtolnay/rust-toolchain@stable`).
# No SHA pins available yet; tag-based reference acceptable per L37
# rule 2 (verified-cached SHAs land in a follow-up commit after the
# first successful CI run captures the resolved SHAs).
#
# Per L29 + L55: live-testnet tests stay operator-driven; CI never runs
# `cargo test` for this branch. Scope = `-p polygon` only — never
# `--workspace` (bitcoin-wallet-core FFI tests dominate workspace
# runtime). Lint + compile-only gate.

on:
  push:
    branches: [task/polygon-full-scenario/8-amoy-gap-fill]
  pull_request:
    branches: [task/polygon-full-scenario/8-amoy-gap-fill]
  workflow_dispatch: {}

# Least-privilege token. CI doesn't push or comment.
permissions:
  contents: read

# Concurrency group kept for log dedup (mirror of rust-evm-core-ci.yml
# Path B 2026-08-28 — `cancel-in-progress: true` removed because Phase
# 8 child PRs typically push several commits in quick succession).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  rust-fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable  # stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        working-directory: rust-wallet-app
        run: cargo fmt --all -- --check

  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    # 10m ceiling — `-p polygon` only (no workspace tree walk, no FFI
    # tests, no bitcoin-wallet-core cold cache). Mirrors the rust-evm-core
    # clippy job's timeout, scoped tighter per L55.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable  # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2  # v2
        with:
          workspaces: rust-wallet-app -> target
      - name: cargo clippy
        working-directory: rust-wallet-app
        # L55: scope `-p polygon` not `--workspace`. L29: live-testnet
        # tests are `#[ignore]` + operator-driven; compile-only gate.
        run: cargo clippy -p polygon --all-targets -- -D warnings

  # Compile-only gate (the `cargo test --no-run` part of L13 step 11
  # acceptance: "Existing 5 tests continue to pass under
  # `cargo test -p polygon --tests --no-run`"). Runs without
  # `RUN_POLYGON_AMOY=1` so every `#[ignore]`'d test compiles but does
  # not execute — confirms the env-reading refactor + `dotenvy` dep
  # survived cargo's resolver.
  rust-compile:
    name: Rust test compile (no run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable  # stable
      - uses: Swatinem/rust-cache@v2  # v2
        with:
          workspaces: rust-wallet-app -> target
      - name: cargo test --no-run (all tests, ignored included)
        working-directory: rust-wallet-app
        # L55: `-p polygon` not `--workspace`. `--no-run` builds every
        # test binary across `polygon/tests/` (including all `#[ignore]`'d
        # ones) but skips execution — confirms the P8-T-setup refactor +
        # every new test file under `polygon/tests/amoy_p9_pk_import.rs`
        # and friends compiles cleanly.
        run: cargo test -p polygon --tests --no-run

  # Scoped runtime gate for `polygon/tests/amoy_erc20_send.rs` —
  # the single live-Amoy ERC-20 transfer test (1 #[ignore]'d fn at
  # `:402`, gated on `RUN_POLYGON_AMOY=1` + public Amoy RPC + funded
  # PK). Runs WITHOUT env vars per L29/L55 — expected to fail at
  # the helper's env-var check. Sister pattern to `rust-compile`
  # above (compile stays green as PR-merge gate; this surfaces
  # the L29 gap for the one file).
  rust-test-amoy-erc20-send:
    name: Rust test amoy_erc20_send (incl. ignored)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4  # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable  # stable
      - uses: Swatinem/rust-cache@v2  # v2
        with:
          workspaces: rust-wallet-app -> target
      - name: cargo test --include-ignored (amoy_erc20_send only)
        working-directory: rust-wallet-app
        # L55: `-p polygon` + `--test amoy_erc20_send` (single test
        # binary, not `--tests`). `--include-ignored` forces the
        # lone `#[ignore]` fn at `:402` to execute; without
        # `RUN_POLYGON_AMOY=1` it fails at `require_run_polygon_amoy`.
        run: cargo test -p polygon --test amoy_erc20_send -- --include-ignored
