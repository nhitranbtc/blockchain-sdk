name: rust-evm-core

# CI for the `rust-evm-core` integration branch.
#
# Scope: any PR that targets `rust-evm-core` (NOT main). Each issue labeled
# `rust-evm-core` (#423-#426 for the Polygon chain, umbrella #416) feeds work
# via a sub-task branch that PRs into this branch. At v0.1 completion, a
# final cut PR merges `rust-evm-core` -> main (per L25).
#
# Per L37 (action-SHA hygiene): actions pinned by tag here mirror the umbrella
# ci.yml (`actions/checkout@v4`, `dtolnay/rust-toolchain@stable`,
# `Swatinem/rust-cache@v2`). No SHA pins available yet; tag-based reference
# acceptable per L37 rule 2 (verified-cached SHAs land in a follow-up commit
# after the first successful CI run captures the resolved SHAs).

on:
  push:
    branches: [rust-evm-core]
  pull_request:
    branches: [rust-evm-core]
  workflow_dispatch: {}

# Least-privilege token. CI doesn't push or comment.
permissions:
  contents: read

# NOTE (Path B 2026-08-28, PR #430): `cancel-in-progress: true` removed.
# Phase 1 PR (#430) hit cascade-cancel: 3 substantive commits in 17 min
# killed the in-flight `Rust test` job twice (Run 7 @ 13m20s, Run 8 @ 14m)
# before `cargo test --workspace` could finish. The 40m `timeout-minutes`
# on `Rust test` was never reached — auto-cancel from new pushes was the
# real killer. Removed here so the test budget is the test budget.
# Re-add per-workflow if a different gate pattern emerges.
# Concurrency group kept for log dedup (still useful for grouping runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  rust-fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable # stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        working-directory: rust-wallet-app
        run: cargo fmt --all -- --check

  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable # stable
        with:
          components: clippy
      - name: Install protoc (>=3.12)
        # Required by spikes/tron-v1/build.rs (prost-build compiles vendored
        # core/Tron.proto). Issue #403 deliverable #9. Debian/Ubuntu:
        # protobuf-compiler package ships protoc 3.x.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2 # v2
        with:
          workspaces: rust-wallet-app -> target
      - name: cargo clippy
        working-directory: rust-wallet-app
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust test
    runs-on: ubuntu-latest
    # 60m ceiling (bumped from 40m on 2026-08-28 per PR #430 Path B):
    # `bitcoin-wallet-core` FFI tests in the workspace include a
    # `wallet_show_unreachable_esplora` test that deliberately waits for
    # an esplora sync timeout (~60-90s), plus several FFI tests around
    # the same magnitude. Whole-workspace `cargo test --workspace
    # --all-targets` can take 30-40 min depending on cache state. 60m
    # gives headroom without GH default 6h.
    # `evm-wallet-core/tests/` carries 18 #[ignore] e2e tests across 9
    # files (L29 carve-out — operator-driven against live testnets /
    # Anvil fork). `cargo test --workspace --all-targets` defaults skip
    # them; the run never opens a live RPC connection.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (>=3.12)
        # Required by spikes/tron-v1/build.rs (prost-build compiles vendored
        # core/Tron.proto). Issue #403 deliverable #9.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2 # v2
        with:
          workspaces: rust-wallet-app -> target
      - name: Install Foundry (anvil)
        # `crates/polygon/tests/polygon_wallet_scenario.rs` spawns `anvil`
        # in-process via `alloy-node-bindings` (per #438 acceptance). Run
        # 33293946213 failed with `SpawnError(Os { code: 2, kind: NotFound })`
        # because this job lacked the Foundry install step that the
        # sibling `Polygon Anvil e2e` job already has.
        uses: foundry-rs/foundry-toolchain@v1
      - name: cargo build
        working-directory: rust-wallet-app
        run: cargo build --workspace
      - name: cargo test
        working-directory: rust-wallet-app
        run: cargo test --workspace --all-targets

  # CI 4th gate per L13 step 11: cargo tree --workspace --duplicates. Local
  # step 11 is double gate only (fmt + clippy); `cargo test --workspace
  # --all-targets` lives in CI (rust-test job above). Dedup moves to CI
  # cadence because workspace-wide tree walks are slow on large workspaces.
  rust-dedup:
    name: Rust dep dedup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (>=3.12)
        # Required by spikes/tron-v1/build.rs (prost-build compiles vendored
        # core/Tron.proto). Issue #403 deliverable #9.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2 # v2
        with:
          workspaces: rust-wallet-app -> target
      - name: cargo tree --duplicates
        working-directory: rust-wallet-app
        run: cargo tree --workspace --duplicates

  # Audit policy mirrors rust-eth-core-ci.yml exactly: the 4 `--ignore` flags
  # below cover transitive dev-deps (rust-bitcoin regtest chain,
  # testcontainers-tokio-tar, pre-existing umbrella allowance). The canonical
  # list lives in `rust-wallet-app/deny.toml`. Add inline justification per
  # advisory if/when the upstream publishes a fix.
  rust-audit:
    name: Rust audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        working-directory: rust-wallet-app
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2025-0111

  # Split from the old combined lint-audit job so deny runs in parallel with
  # audit — same per-concern shape as umbrella `ci.yml` and `rust-eth-core-ci.yml`.
  rust-deny:
    name: Rust deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny
        working-directory: rust-wallet-app
        run: cargo deny check

  # Unsafe-code audit per CLAUDE.md conventions (`cargo geiger` listed).
  # Mirrors the deny/audit shape: parallel job, rust-cache warms deps,
  # cargo-geiger installed via `cargo install --locked` (L37 hygiene —
  # upstream crate, not a third-party binary blob).
  # Workspace-wide scan; transitive `unsafe` counts are noisy but the
  # trend over time is the signal. rust-cache warms the build + install.
  rust-geiger:
    name: Rust unsafe-code audit (geiger)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (>=3.12)
        # Required by spikes/tron-v1/build.rs (prost-build compiles vendored
        # core/Tron.proto). Issue #403 deliverable #9.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2 # v2
        with:
          workspaces: rust-wallet-app -> target
      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked
      - name: cargo geiger (per crate)
        working-directory: rust-wallet-app
        # `cargo geiger --workspace` rejects virtual manifests (CI run 33290091878).
        # Per-crate scan: cd into each crate dir so geiger treats it as the package
        # root. Dedicated CARGO_TARGET_DIR keeps this job's build artifacts out of
        # the shared rust-cache target (other parallel jobs rely on it) and sidesteps
        # stale target/ Io errors from spikes/ test renames.
        # Audit is advisory (trend monitoring) per the original workflow comment.
        # Crates/* report transitive unsafe counts (ring/aws-lc-rs/etc.) that drown
        # the first-party signal — follow-up issue tracks `--forbid-only` migration
        # to make the audit meaningful.
        # Sink-arg hygiene (push security review for run 33290091878): sanitize
        # $crate_dir for ::group:: title, [[ -d ]] guard, no ::warning:: injection
        # surface.
        run: |
          for crate_dir in crates/*/; do
            [[ -d "$crate_dir" ]] || continue
            safe="${crate_dir//$'\n'/ }"
            safe="${safe//$'\r'/ }"
            safe="${safe//::/:}"
            echo "::group::$safe"
            (cd "$crate_dir" && CARGO_TARGET_DIR=/tmp/geiger-target cargo geiger) || true
            echo "::endgroup::"
          done

  # AC #5 audit-gate per Issue #382 (rooted in the centralised
  # `Error::rpc(impl Display)` redaction in `eth-wallet-core`). Scope
  # expansion in #428: this job now also scans `evm-wallet-core` since the
  # Phase 0 refactor (commit `21540f0`) moved the `Network` enum + redaction
  # shape into the new crate. Pattern matches `Rpc(\s*format!` (extended
  # regex) — catches both `Error::Rpc(format!(...))` and the equally leaky
  # `Self::Rpc(format!(...))` + tolerates whitespace after the open paren.
  # Rust doc-comment lines (`///`) are filtered so the gate does not
  # self-flag on its own pointer. Any non-zero exit fails the workflow on
  # PR + push to `rust-evm-core`.
  rust-error-grep:
    name: Rust Error::Rpc(format!) audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false
      - name: grep -rnE 'Rpc\(\s*format!' must return 0 code matches
        run: |
          if grep -rnE 'Rpc\(\s*format!' \
              rust-wallet-app/crates/eth \
              rust-wallet-app/crates/eth-wallet-core \
              rust-wallet-app/crates/evm-wallet-core \
              | grep -v '///'; then
            echo "::error::Rpc(format!...) bypasses the centralised" \
              "redaction in Error::rpc(impl Display) and may leak RPC URL" \
              "secrets via Display. Use Error::rpc(e) instead."
            exit 1
          fi

  # Anvil-fork e2e suite for `polygon-v1-spike` (V9 MockUSDC + use-case
  # alpha→beta 100 USDC). Mirrors `.github/workflows/rust-eth-core-ci.yml`
  # `anvil-e2e` job shape: Anvil spawns a fork in-process, no live RPC
  # broadcast, no public-RPC flake or CI-IP rate-limit risk (L29 carve-out).
  # Merged from the former `polygon-anvil-e2e` + `polygon-testnet` pair.
  # Single setup (checkout/toolchain/cache/protoc/foundry/workspace build)
  # followed by three sequential test steps covering Anvil spike, the
  # Anvil-backed wallet scenario, and the package-wide `#[ignore]` sweep
  # (Tier 1 hermetic + Tier 2 guard branches). See the per-step comments
  # for the `RUN_POLYGON_*` env-var gates.
  # Polygon e2e — split into two parallel jobs (lib + integration) so
  # `local_testnet_smoke` (~19 min alone) doesn't block the lib test
  # sweep (~16 min). Wall-clock = max(lib, integration) ≈ 25 min —
  # under any single 30/40-min timeout. Split replaced the prior
  # sequential 50-min single job (which kept hitting the cap; latest
  # run terminated at 11:16 with `local_testnet_smoke` still
  # in-flight + 5+ integration binaries queued).
  polygon-lib-tests:
    name: Polygon lib tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2 # v2
        with:
          workspaces: rust-wallet-app -> target
      - name: Install protoc (>=3.12)
        # Required by spikes/tron-v1/build.rs (prost-build compiles vendored
        # core/Tron.proto). Issue #403 deliverable #9.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: cargo build (workspace)
        working-directory: rust-wallet-app
        run: cargo build --workspace
      - name: Polygon bin unit tests
        # `polygon` is a binary-only crate (no `lib.rs`) — `--lib` is
        # invalid for this package. `--bin polygon` runs the unit tests
        # inside `polygon/src/main.rs` + its submodule `#[cfg(test)]`
        # blocks (~16 min on cached CI). Integration binaries land in
        # the sister job below.
        working-directory: rust-wallet-app
        run: cargo test -p polygon --bin polygon

  polygon-integration-tests:
    name: Polygon integration tests (local Anvil + Amoy testnet)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2 # v2
        with:
          workspaces: rust-wallet-app -> target
      - name: Install protoc (>=3.12)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Foundry (anvil)
        # `local_testnet_smoke` spawns `anvil` in-process via
        # `alloy-node-bindings` (sister to `polygon_wallet_scenario`).
        uses: foundry-rs/foundry-toolchain@v1
      - name: cargo build (workspace)
        working-directory: rust-wallet-app
        run: cargo build --workspace
      - name: Polygon package — all integration tests (incl. `#[ignore]`'d)
        # Sweeps every `tests/*.rs` integration binary in the `polygon`
        # package — `local_testnet_smoke` (Tier 1, hermetic, opt-in via
        # `RUN_POLYGON_LOCAL=1` per L29) + `amoy_smoke` / `mainnet_smoke`
        # / `amoy_erc20_send` / `amoy_p9_pk_import` / `amoy_sign_only`
        # / `amoy_error_paths` / `amoy_erc20_balance` (Tier 2, L29
        # operator-driven carve-out — early-return → PASS when their
        # `RUN_POLYGON_*` guards find the var unset, so leaving those
        # vars unset keeps CI hermetic). `--include-ignored` runs every
        # `#[ignore]`'d test in each binary. `--test-threads=1`
        # preserves deterministic ordering for the shared Anvil fixture.
        # Phase 1-7 of Issue #495 (`local_testnet_smoke.rs` gap-fill)
        # land here. Scope `-p polygon` only — never `--workspace`
        # (L55: bitcoin-wallet-core FFI dominates).
        working-directory: rust-wallet-app
        env:
          RUN_POLYGON_LOCAL: "1"
        run: cargo test -p polygon --tests -- --include-ignored --test-threads=1
