name: Tron integration

# Phase 4 §4.3 — TronBox local testnet integration tests (testcontainers).
#
# Triggers on pushes to `rust-tron-core` (the v0.1 integration branch per
# plan Phase Set Up Task S.2), on PRs that target `rust-tron-core`, and on
# manual dispatch. Never on `main` — the umbrella `ci.yml` covers main.
#
# Scope: spawns the `tronbox/tre:latest` Docker image via testcontainers and
# exercises the integration harness in
# `rust-wallet-app/spikes/tron-v1/tests/trc20_local.rs`. The deeper scenario
# rows (1-7a, 8) ship as `#[ignore]` stubs awaiting the `MockTRC20.sol`
# fixture + `tronbox migrate --network development` harness; the spawn +
# readiness probe + chain-id + TAPOS probes run unconditionally here.
#
# `RUN_TRON_LOCAL=1` is exported so the gated live tests surface loud-RED on
# missing prerequisites (Docker daemon, image pull) per plan gated-live-test
# convention. Operators who want CI-excluded semantics can disable the env
# var or drop the workflow.

on:
  push:
    branches: [rust-tron-core]
  pull_request:
    branches: [rust-tron-core]
  workflow_dispatch: {}

# Least-privilege token. CI doesn't push or comment.
permissions:
  contents: read

# Cancel in-progress runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-tronbox-local:
    name: TronBox local (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      docker:
        # docker-in-docker — testcontainers spawns TronBox into this daemon.
        image: docker:dind
        options: --privileged
    env:
      RUN_TRON_LOCAL: "1"
      # Silence colored cargo output for cleaner CI logs.
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          # Plan Task 0.1 — MSRV pin 1.98.1 for anychain-{core,tron,kms}.
          toolchain: "1.98.1"
      - name: Install protoc (>=3.12)
        # Required by spikes/tron-v1/build.rs (prost-build compiles vendored
        # core/Tron.proto). Mirrors rust-tron-core-ci.yml step.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          protoc --version
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-wallet-app -> target
      - name: Pre-pull TronBox Docker image
        # Cuts cold-start latency from ~60s (testcontainers inline pull) to
        # ~5s (warm layer cache). Failure here surfaces loud-RED with the
        # exact missing-image message.
        run: |
          docker pull tronbox/tre:latest || {
            echo "::error::docker pull tronbox/tre:latest failed — verify image name and Docker Hub availability" >&2
            exit 1
          }
      - name: Run trc20_local integration tests
        working-directory: rust-wallet-app
        # --ignored flag opts the gated live tests into the run. The
        # silent-skip pattern is forbidden — loud-RED panic gate (see
        # tests/trc20_local.rs::require_local_opt_in) handles the case where
        # the Docker daemon is unreachable.
        run: |
          cargo test --test trc20_local -- --ignored --nocapture
      - name: Run trc20_local unit (URL parsing) tests
        working-directory: rust-wallet-app
        # Without --ignored: only the always-on unit tests run (URL parsing,
        # ClientParseError variants). These MUST stay green regardless of
        # Docker availability.
        run: |
          cargo test --test trc20_local -- --nocapture