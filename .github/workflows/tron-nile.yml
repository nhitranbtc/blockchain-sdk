name: Nile integration

# Phase 4 §4.6 — Nile testnet integration tests (operator-driven, manual only).
#
# Per plan: **No automated CI** — Nile tests are slow + need faucet funds.
# Triggers ONLY on `workflow_dispatch` (manual run from the Actions UI by
# operators who have funded the test wallet via the Nile faucet).
#
# Required secrets (configured in repo Settings → Secrets):
#   - TRON_TEST_MNEMONIC: BIP-39 phrase (12 or 24 words) for the test wallet
#   - TRON_NILE_RECIPIENT: T-address for the transfer recipient
#   - TRON_NILE_SPKI_PIN (optional): SPKI pin hex override; falls back to
#     bundled pin from `tokens/nile.json`
#
# Scope: runs the canonical `trc20_transfer_full_flow_nile` in
# `rust-wallet-app/spikes/tron-v1/tests/trc20_nile.rs`. Loud-RED panic gate
# in the test fires on missing env vars — the harness must report FAILED
# rather than silently passing per plan gated-live-test convention.

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: "Recipient T-address (defaults to secret TRON_NILE_RECIPIENT)"
        required: false
        type: string

# Least-privilege token. Manual runs don't push or comment.
permissions:
  contents: read

# Single concurrent run — overlapping manual dispatches on the same ref get
# cancelled to avoid double-spending the faucet-funded sender.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-nile:
    name: Nile TRC-20 full flow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Loud-RED gate: test panics on missing vars per Phase 4 §4.4.
      TRON_NILE_INTEGRATION: "1"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          # Plan Task 0.1 — MSRV pin 1.98.1 for anychain-{core,tron,kms}.
          toolchain: "1.98.1"
      - name: Install protoc (>=3.12)
        # Required by spikes/tron-v1/build.rs (prost-build compiles vendored
        # core/Tron.proto).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          protoc --version
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-wallet-app -> target
      - name: Run trc20_nile integration test
        working-directory: rust-wallet-app
        env:
          # Pulled from repo secrets. Recipient defaults to secret but
          # operator-supplied `inputs.recipient` (if any) overrides.
          TRON_TEST_MNEMONIC: ${{ secrets.TRON_TEST_MNEMONIC }}
          TRON_NILE_RECIPIENT: ${{ inputs.recipient || secrets.TRON_NILE_RECIPIENT }}
          TRON_NILE_SPKI_PIN: ${{ secrets.TRON_NILE_SPKI_PIN }}
        run: |
          cargo test --test trc20_nile -- --ignored --nocapture