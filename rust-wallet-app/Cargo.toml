[workspace]
resolver = "2"
members = [
    "crates/chain-traits",
    "crates/bitcoin-wallet-core",
    "crates/btc",
    "crates/evm-wallet-core",
    "crates/eth-wallet-core",
    "crates/eth",
    "crates/polygon-wallet-core",
    "crates/polygon",
    "crates/tron-wallet-core",
    "crates/tron",
    "crates/sol-wallet-core",
    "crates/sol",
    "crates/anychain-vendored/anychain-core",
    "crates/anychain-vendored/anychain-tron",
    "crates/anychain-vendored/anychain-kms",
    "spikes/tron-v1",
    "spikes/polygon-v1",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
# repository — set per fork. Default placeholder: change to your fork URL.

[workspace.dependencies]
# TRON (anychain stack — plan Phase 0 Task 0.2 / ADR-0001).
# VENDORED from 0xcregis/anychain @ cf3aa2d (revision 2026-09-06, flipped by
# issue #540). Local-path references replace crates.io pins so consumer builds
# NEVER see `crates.io/index` for these names — local-path wins deterministically.
# SOURCE.md per vendored crate records pinned commit SHA + patch log.
anychain-core = { path = "crates/anychain-vendored/anychain-core" }
anychain-tron = { path = "crates/anychain-vendored/anychain-tron" }
anychain-kms = { path = "crates/anychain-vendored/anychain-kms" }
tron-wallet-core = { path = "crates/tron-wallet-core" }
# Phase 7 CLI-driven spike — `spikes/tron-v1` drives the shipped `tron` binary
# via assert_cmd. Workspace dep so the spike can `tron = { workspace = true }`.
tron = { path = "crates/tron" }

# Per-chain SDKs
bitcoin-wallet-core = { path = "crates/bitcoin-wallet-core" }
sol-wallet-core = { path = "crates/sol-wallet-core" }
sol = { path = "crates/sol" }
bitcoin = { version = "0.32", features = ["serde"] }  # F20/TD-03: serde feature required by config::WalletConfig (Network: Serialize).
# bdk_wallet enables it transitively today; declare directly so a bdk
# minor bump can't silently break the build. Same pattern as bip39/zeroize
# (CONTEXT.md hard rule #6).

# Bitcoin (BDK 3.1 + fallback chain per F26)
# Note: bdk_wallet 3.x pins bdk_chain 0.23.x and bdk_file_store 0.22.x.
# Plan §Task 1 Step 2 originally cited ^3.1 for both; corrected to actual
# published versions on crates.io (see ledger note 2026-08-07).
bdk_wallet = { version = "^3.1", features = ["keys-bip39"] }
bdk_chain = "^0.23"
bdk_electrum = "^0.24"
bdk_file_store = "^0.22"
# bdk_esplora dropped per drift update 2026-08-07: pulls transitive
# rustls-webpki 0.101.7 (RUSTSEC-2026-0106) + esplora-client that we
# don't use (Task 7 EsploraClient is raw reqwest + custom cert verifier
# per F20). Re-add only if/when we actually need bdk_esplora's sync helpers.
bip32 = "^0.5"  # F46 fallback: 0.6 is pre-release only (0.6.0-pre.1)
# BIP-39 mnemonic (Task 3) — direct dep to enable `zeroize` feature flag.
# bdk_wallet's bip39 dep has no features → re-exported Mnemonic does NOT
# impl Zeroize. `Secret<Mnemonic>` requires Zeroize (F47/F53, U3), so we
# force feature unification here. Also enables `rand` for
# `Mnemonic::generate` (uses thread_rng internally).
bip39 = { version = "2.2", features = ["zeroize", "rand"] }

# Shared async + HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Errors + tracing
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Crypto (per F6 mnemonic encryption in v0.1 core)
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"

# Test
proptest = "1"
tempfile = "3"
serial_test = "3"

# FFI codegen (Task 1 spike + Phase 1 of 2026-08-19 FFI integration plan)
cbindgen = "0.27"

# Encoding (used by crypto::bip137 for base64-encoded message signatures)
base64 = "0.22"

# Hex (used by eth-wallet-core for SPKI pin decoding + token JSON serialization)
hex = "0.4"

# Wallet ID + filesystem layout (Task 54d / Issue #64, ADR 0001)
uuid = { version = "1", features = ["v4", "serde"] }
directories = "5"

# Constant-time comparison (used by crypto::bip137 for hash160 verify per F50)
subtle = "2"

# TLS pinning (Task 7 — F20 SPKI pinning per threat model B2/U2).
# Raw reqwest + custom ServerCertVerifier (CONTEXT.md hard rule #2:
# no bdk_esplora; pulls rustls-webpki 0.101.7 RUSTSEC-2026-0106).
rustls             = { version = "0.23", default-features = false, features = ["std", "tls12", "logging", "ring"] }
rustls-native-certs = "0.7"  # Native system CA roots (Task 7 — F20 TLS pinning)
sha2               = "0.10"
webpki             = { version = "0.22", default-features = false, features = ["std"] }
x509-parser        = "0.16"  # SPKI DER extraction (Task 7 — F20 TLS pinning)

# Serde (config + Error serialization)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Ethereum SDK — alloy v1.8.x (Issue #293 Q1 resolution: pin meta exact,
# sub-crates use ^1.x for minor-float within unified semver). Features
# grow incrementally per Task — Task 1 needs only signers + signer-local;
# Tasks 5+ add providers/network/transport-http. Same shape as spike V1.
alloy = { version = "=1.8.3", default-features = false, features = [
    "std",
    "signers",
    "signer-local",
] }
alloy-primitives = { version = "^1.6", default-features = false, features = ["std"] }
alloy-signer-local = { version = "^1.0", features = ["mnemonic"] }
# EVM sub-crates used by eth-wallet-core + polygon-v1-spike (Issue #417).
# Pinned to =1.8.3 for crate-wide 1.x sync; ^1.0 acceptable per eth-wallet-core
# precedent — both lock the umbrella to the same minor version.
alloy-provider = { version = "=1.8.3" }
alloy-network = { version = "=1.8.3" }
alloy-transport-http = { version = "=1.8.3" }
alloy-sol-types = { version = "^1.6" }
alloy-consensus = { version = "=1.8.3" }
alloy-eips = { version = "=1.8.3" }
alloy-rpc-types = { version = "=1.8.3" }

# TRON SDK — prost/bs58/keccak (Q2/Q3/Q4 — plan §B; added 2026-08-27 for Issue #403 spike)
prost = "=0.14.4"
prost-types = "=0.14.4"
bs58 = "0.5"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }

# TRC-20 ABI (Phase 3 §D). Pinned to match anychain-tron's own pinned versions
# (workspace-resolved via anychain's vendored Cargo.toml) so a re-export
# of `ethereum_types::U256` and `ethabi::Token` is byte-for-byte the same
# type anychain-tron hands back from `abi::trc20_transfer`.
ethereum-types = "=0.13.1"
ethabi = "=17.2.0"

# Solana SDK — Anza stack (solana-sdk 4.1.0 lineage; exact pins per
# plan §Task 0.1). Q9 (no Solana web3.js / @solana/* JS surface) and Q13
# (no spl-token CLI) are orthogonal and enforced separately. The CLI
# binary is `sol` (22 commands, Phase 7); the library is `sol-wallet-core`
# (Anza SDK re-exports + Phantom-equivalent Wallet, Phase 1+).
#
# Every solana-* dep below is `=x.y.z` exact-pin to keep Anza's internal
# type graph byte-for-byte consistent across the workspace — a transitive
# bump that lands in `solana-sdk` 4.1.1 must NOT silently flow here, since
# the v0.1 threat model pins behaviour at the 4.1.0 ABI. Pin drift surfaces
# as `cargo tree -p sol-wallet-core` divergence in CI (Step 6).
#
# `solana-client` and `solana-rpc-client` are duplicated by design: the
# umbrella crate re-exports both, and unifying them at a higher version
# silently breaks the re-export graph. Pin =x.y.z matches what Anza ships
# in its monorepo tag.
solana-sdk                    = "=4.1.0"
solana-program                = "=4.1.0"
solana-keypair                = "=3.1.2"
solana-signer                 = "=3.0.1"
solana-message                = "=4.6.0"
solana-transaction            = "=4.3.0"
solana-instruction            = "=3.5.0"
solana-client                 = "=4.2.2"
solana-rpc-client             = "=4.2.2"
solana-compute-budget-program = "=4.2.2"
# Phase 3 (tx::builder) — modern Anza split: `solana-system-interface`
# re-exports `system_instruction::transfer` (the canonical SOL-transfer
# builder used by every Phantom-shaped wallet). `solana-compute-budget-interface`
# carries `ComputeBudgetInstruction` — note `solana-program` 4.1.0's lib.rs
# doc-comment references this type but does NOT declare the dep; we
# declare it directly so the builder can produce Compute Budget
# instructions without forcing the Solana-program runtime crate.
# Exact-pin per CONTEXT.md hard rule #6 (Anza ABI = 4.1.0 lineage).
solana-system-interface         = { version = "=3.3.0", features = ["bincode"] }
solana-compute-budget-interface = { version = "=3.1.0", features = ["serde"] }

# SPL — pinned versions match what the Anza SDK 4.1.0 ABI declares in its
# Cargo.toml. Each crate's published version tracks Anza's monorepo tag,
# and unifying against a higher version would silently widen the type
# surface (Token-2022 disambiguation is sensitive here; see Phase 4).
spl-token                    = "=9.0.0"
spl-token-2022               = "=11.0.0"
spl-associated-token-account = "=8.0.0"
spl-memo                     = "=7.0.0"

# BIP-32 / BIP-39 — ed25519-bip32 used by Phantom's mnemonic → seed path
# (Phase 1.1). exact-pin =0.4.3 because the crate's API has had breaking
# changes at 0.5.x and the v0.1 threat model tests against the 0.4 ABI.
# bip39 itself is already in workspace (line 84) with `zeroize` + `rand`
# features; the SOL crate reuses that entry as-is.
ed25519-dalek                = "=3.0.0"
ed25519-bip32                = "=0.4.3"

# Solana-only additions on top of the shared workspace table:
#   sha3 — Anza uses keccak/sha3 for the Solana wire-format hashing;
#          no sibling crate needs it, so it lives here only.
#   hmac — BIP-32 master-node derivation in Phase 1.1.
#   chrono — Phase 6 wallet timestamps.
#   once_cell, regex — small utils used by the SOL crate alone.
sha3      = "0.10"
hmac      = "0.12"
chrono    = "0.4"
once_cell = "1"
regex     = "1"

# Phase 8.2 Step 3b — release-mobile profile (audit H7/H8/M18).
# Workspace-level so cargo accepts `--profile release-mobile` flag.
# Mobile targets (iOS/Android) consume this profile.
#
# Trade-offs vs `release`:
#   - `panic = "abort"` — Rust unwinder disabled; FFI panic-scrubber
#     path (Step 1) is dev-only.
#   - `opt-level = "z"` — minimum size; mobile binary size matters.
#   - `lto = true` — cross-crate inlining reduces exported symbol
#     surface (defense-in-depth complement to `Wl,--exclude-libs,ALL`).
#   - `strip = "symbols"` — debug symbols stripped from cdylib
#     (saves 5–15 MB on mobile + reduces ROP gadget surface).
#   - `codegen-units = 1` — required for symbol-strip + LTO determinism.
# Build with `--profile release-mobile --target <triple>`.
[profile.release-mobile]
inherits      = "release"
panic         = "abort"
opt-level     = "z"
lto           = true
strip         = "symbols"
codegen-units = 1
debug         = false
