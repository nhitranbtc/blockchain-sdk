[workspace]
resolver = "2"
members = [
    "crates/chain-traits",
    "crates/bitcoin-wallet-core",
    "crates/btc",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
# repository — set per fork. Default placeholder: change to your fork URL.

[workspace.dependencies]
# Per-chain SDKs
bitcoin-wallet-core = { path = "crates/bitcoin-wallet-core" }
bitcoin = "0.32"

# Bitcoin (BDK 3.1 + fallback chain per F26)
# Note: bdk_wallet 3.x pins bdk_chain 0.23.x and bdk_file_store 0.22.x.
# Plan §Task 1 Step 2 originally cited ^3.1 for both; corrected to actual
# published versions on crates.io (see ledger note 2026-08-07).
bdk_wallet = { version = "^3.1", features = ["keys-bip39"] }
bdk_chain = "^0.23"
bdk_electrum = "^0.24"
bdk_file_store = "^0.22"
# bdk_esplora dropped per drift update 2026-08-07: pulls transitive
# rustls-webpki 0.101.7 (RUSTSEC-2026-0106) + esplora-client that we
# don't use (Task 7 EsploraClient is raw reqwest + custom cert verifier
# per F20). Re-add only if/when we actually need bdk_esplora's sync helpers.
bip32 = "^0.5"  # F46 fallback: 0.6 is pre-release only (0.6.0-pre.1)
# BIP-39 mnemonic (Task 3) — direct dep to enable `zeroize` feature flag.
# bdk_wallet's bip39 dep has no features → re-exported Mnemonic does NOT
# impl Zeroize. `Secret<Mnemonic>` requires Zeroize (F47/F53, U3), so we
# force feature unification here. Also enables `rand` for
# `Mnemonic::generate` (uses thread_rng internally).
bip39 = { version = "2.2", features = ["zeroize", "rand"] }

# Shared async + HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Errors + tracing
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Crypto (per F6 mnemonic encryption in v0.1 core)
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Test
proptest = "1"
tempfile = "3"

# Encoding (used by crypto::bip137 for base64-encoded message signatures)
base64 = "0.22"

# Constant-time comparison (used by crypto::bip137 for hash160 verify per F50)
subtle = "2"

# Serde (config + Error serialization)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
