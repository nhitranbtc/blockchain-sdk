[package]
name = "anychain-core"
version = "0.1.0-local.0"
description = "A core support for cryptocurrency wallets (VENDORED from 0xcregis/anychain @ cf3aa2d — see SOURCE.md)"
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]
keywords = ["bitcoin", "blockchain", "ethereum", "no_std"]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
sha3 = "0.10"
thiserror = "1"
ripemd = "0.1"
bech32 = "0.7"
hex = "0.4"
base58 = { version = "0.2", optional = true }
rand_core = "0.6"
serde_json = "1"
sha2 = "0.10"

[features]
default = ["std"]
std = ["base58"]