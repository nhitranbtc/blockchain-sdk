[package]
name = "anychain-kms"
version = "0.1.0-local.0"
description = "Key Management Schema for AnyChain (VENDORED from 0xcregis/anychain @ cf3aa2d — see SOURCE.md)"
keywords = ["cryptography", "security", "signature", "algorithm"]
categories = ["cryptography::cryptocurrencies"]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anychain-core = { path = "../anychain-core" }
rustc-hash = "1"
rand = "0.8.6"
sha2 = { version = "0.10.8", default-features = false }
hmac = "0.12"
bs58 = { version = "0.4", default-features = false, features = ["check", "alloc"] }
pbkdf2 = "0.12"
unicode-normalization = "0.1"
anyhow = "1"
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }
once_cell = "1"
subtle = "2"
ripemd = "0.1"
hex = "0.4"
libsecp256k1 = "0.7"
ed25519-dalek = { version = "2", features = ["hazmat"] }
curve25519-dalek = { version = "4.1.3", features = ["group"] }
group = "0.13"
encoding = "0.2"

[dev-dependencies]
hex-literal = "0.4"

[features]
alloc = ["zeroize/alloc"]
std = ["alloc"]
chinese-simplified = []
chinese-traditional = []
french = []
italian = []
japanese = []
korean = []
spanish = []
default = ["std", "chinese-simplified", "chinese-traditional", "french", "italian", "japanese", "korean", "spanish"]