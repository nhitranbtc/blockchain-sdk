[package]
name = "anychain-tron"
version = "0.2.0-local.0"
description = "A Rust library for Tron-focused cryptocurrency wallets (VENDORED from 0xcregis/anychain @ cf3aa2d — see SOURCE.md)"
keywords = ["tron", "blockchain", "wallet", "transactions"]
categories = ["cryptography::cryptocurrencies"]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anychain-core = { path = "../anychain-core" }
serde = "1"
serde_json = "1"
sha3 = "0.10"
sha2 = "0.10"
hex = "0.4"
base58 = "0.2"
protobuf = "3.7"
chrono = "0.4"
ethabi = "=17.2.0"
libsecp256k1 = "0.7"
ethereum-types = "=0.13.1"