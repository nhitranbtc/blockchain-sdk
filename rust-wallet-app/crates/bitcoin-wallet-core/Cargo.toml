[package]
name = "bitcoin-wallet-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# repository.workspace = true  # uncomment if workspace.repository set

[features]
default = []
regtest-tests = []  # per F3

[lib]
# rlib for Rust callers (btc CLI), cdylib for FFI (wallet-desktop dart:ffi).
crate-type = ["rlib", "cdylib"]

[dependencies]
bdk_wallet = { workspace = true, features = ["keys-bip39"] }
bdk_chain = { workspace = true }
bdk_electrum = { workspace = true }
bdk_file_store = { workspace = true }
bitcoin = { workspace = true }
bip32 = { workspace = true }
bip39 = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
argon2 = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs"] }
rustls-native-certs = { workspace = true }
sha2 = { workspace = true }
webpki = { workspace = true }
x509-parser = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
directories = { workspace = true }
# Task 2 (FFI plan): regex + once_cell for L12 CRITICAL #2 panic-message
# scrubbing in src/ffi/panic.rs (redacts password=/mnemonic=/secret= + BIP-39
# 12-word sequences from panic payloads before they surface to Dart).
once_cell = "1"
regex = "1"

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true }

[build-dependencies]
cbindgen = { workspace = true }