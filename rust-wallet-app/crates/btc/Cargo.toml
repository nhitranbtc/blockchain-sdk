[package]
name = "btc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "btc"
path = "src/main.rs"

[dependencies]
bitcoin-wallet-core = { workspace = true }
bitcoin = { workspace = true }
bip32 = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
rpassword = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Issue #112 / testcontainers regtest smoke (PR #111 follow-up).
# `testcontainers` for ephemeral containers; `reqwest` for HTTP RPC client.
testcontainers = { version = "0.23", default-features = false, features = ["blocking"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# `bitcoind` for the regtest JSON-RPC client (boot + mine + send).
# Pinned to a recent 0.36 release; same minor as the in-tree bitcoind
# pattern referenced in the task-sdk map (Task 15).
bitcoind = { version = "0.36", default-features = false, features = ["0_21_2"] }