[package]
name = "eth-wallet-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
description = "Ethereum (ETH + ERC-20) wallet library — thin wrapper over `evm-wallet-core`. Phase 0 refactor of Issue #416 / plan `docs/superpowers/plans/2026-08-27-polygon-wallet-core.md`. Future work: polygon-wallet-core mirrors this shape."
# All implementation now lives in `evm-wallet-core` (Q1 Option A).
# eth-wallet-core is preserved as the Ethereum-specific public surface
# via thin re-exports so existing downstream consumers (`eth` CLI,
# external integrations) compile without import-path changes.
publish = false

[dependencies]
evm-wallet-core = { path = "../evm-wallet-core" }
