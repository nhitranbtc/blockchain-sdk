[package]
name = "eth"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
description = "`eth` CLI for the eth-wallet-core v0.2.0 library"
# Task 10 (Issue #309) — Phase 4 CLI scaffold. Mirrors BTC's
# rust-wallet-app/crates/btc/ structure.
# Issue #337 (Task 13 follow-up): wire LAYOUT stubs to Anvil-backed
# implementations.
publish = false

[[bin]]
name = "eth"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
eth-wallet-core = { path = "../eth-wallet-core" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }
# alloy deps for handlers.rs (provider + RPC).
alloy-primitives = { workspace = true }
alloy-provider = { version = "^1.0" }
alloy-network = { version = "^1.0" }
alloy-transport-http = { version = "^1.0" }
alloy-rpc-types = { version = "^1.0" }
alloy-signer-local = { version = "^1.0", features = ["mnemonic"] }
# uuid for wallet_id parsing in handlers + WalletNotFound construction;
# tokio for the current-thread runtime that drives async handlers in
# main(). Both are dev-only for eth-wallet-core but main + handlers are
# production paths here.
uuid = { workspace = true }
tokio = { workspace = true }
# Issue #341 — load .env from cwd so ETH_NETWORK/ETH_RPC_URL/etc. flow
# into clap env attrs. `.ok()` swallows missing-file errors so CI/clean
# checkouts still run.
dotenvy = "0.15"
# Issue #341 — `eth config show --json` serializer.
serde_json = { workspace = true }

[dev-dependencies]
# Binary integration tests in tests/cli_localnet.rs.
tempfile = { workspace = true }
alloy-node-bindings = { version = "=1.8.3" }
tokio = { workspace = true }
# Issue #343 stablecoin e2e (alpha sends beta 100 USDC on Anvil):
# alloy-contract for Instance::deploy + call builders, alloy-sol-macro for
# the `sol!` proc macro that defines MockUSDC inline in the test, and
# alloy-sol-types for the type primitives the macro generates.
# Pinned to =1.6.1 because alloy-sol-macro only publishes 1.6.1 on
# crates.io (latest stable). The macro + alloy-contract must share the
# same minor for the generated `MockUSDC::deploy` signature to type-check.
alloy-contract = { version = "=1.6.1" }
alloy-sol-macro = { version = "=1.6.1" }
alloy-sol-types = { version = "=1.6.1" }