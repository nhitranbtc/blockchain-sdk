[package]
name = "evm-wallet-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
description = "EVM-compatible (ETH + Polygon + future EVM L2s) wallet library built on alloy v1.8.x. Refactored out of eth-wallet-core (Phase 0 of Issue #416 / plan `docs/superpowers/plans/2026-08-27-polygon-wallet-core.md`)."
# Phase 0 of polygon-wallet-core plan. Q1 Option A: thin eth-wallet-core + polygon-wallet-core wrappers point here.
publish = false

[dependencies]
# all v1.8.x workspace deps. Features kept minimal for Phase 0.
alloy-primitives = { workspace = true }
alloy-signer = { version = "=1.8.3" }
alloy-signer-local = { workspace = true }
bip39 = { workspace = true }
reqwest = { workspace = true }
zeroize = { workspace = true }

# Task 3 (Issue #302) — sign-only primitives.
alloy-consensus = { version = "=1.8.3" }
alloy-eips = { version = "=1.8.3" }
alloy-network = { version = "^1.0" }
alloy-provider = { version = "^1.0" }
alloy-rpc-types = { version = "^1.0" }
alloy-sol-types = { version = "^1.6" }
alloy-transport = { version = "^1.0" }
alloy-transport-http = { version = "^1.0" }

# Task 2 — Argon2id KDF + AES-256-GCM + WalletManager persistence.
argon2 = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
directories = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hex = "0.4"

[features]
insecure_tls = []

[dev-dependencies]
tempfile = { workspace = true }
alloy-node-bindings = { version = "=1.8.3" }
tokio = { workspace = true }
