[package]
name = "polygon-wallet-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
description = "Polygon (PoS) thin wrapper over evm-wallet-core. Phase 1 of Issue #416 / plan `docs/superpowers/plans/2026-08-27-polygon-wallet-core.md`. Adds Polygon-specific RPC URLs + gas-token label re-exports; no signing/RPC code (all inherited from evm-wallet-core)."
publish = false

[dependencies]
evm-wallet-core = { path = "../evm-wallet-core" }

# Re-exports so downstream crates (polygon CLI in Phase 4, tests in this crate)
# can use alloy primitives + BIP-39 mnemonic without depending on evm-wallet-core
# directly. Mirrors how eth-wallet-core exposes them.
alloy-primitives = { workspace = true }
bip39 = { workspace = true }

[dev-dependencies]
# Tests cross-validate derivation against evm-wallet-core's shared mnemonic fn
# (coin type 60' is chain-agnostic). Same setup as evm-wallet-core/tests/mnemonic.rs.
