[package]
name = "polygon"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
description = "`polygon` CLI for the polygon-wallet-core v0.1 library (Issue #426 / Phase 4 of #416)."
publish = false

[[bin]]
name = "polygon"
path = "src/main.rs"

[dependencies]
# Single import surface (Q1 Option A — polygon CLI depends on polygon-wallet-core
# alone for non-alloy types). Includes Error + Result re-exports per Drift #5
# of `docs/superpowers/plans/2026-08-28-polygon-cli-interface-design.md` §2.5.
# T6c: also re-exports WalletManager (additive — `pub use evm_wallet_core::WalletManager`).
polygon-wallet-core    = { path = "../polygon-wallet-core" }
evm-wallet-core        = { path = "../evm-wallet-core" }

# T6b (clap tree + dispatch per L25 sub-task split). Issue #426 / design §3.4.
# `clap = { workspace = true }` carries the `derive` + `env` features per
# `rust-wallet-app/Cargo.toml:67`. `tokio` enables the `block_on(async { ... })`
# dispatch kernel (mirrors `eth/src/main.rs:487-491`).
clap                 = { workspace = true }
tokio                = { workspace = true }

# alloy family for wallet + RPC + signing (T6c — per L25 sub-task split).
# all features from workspace declarations (`rust-wallet-app/Cargo.toml:107-122`).
alloy-primitives     = { workspace = true }
alloy-provider       = { workspace = true }
alloy-network        = { workspace = true }
alloy-transport-http = { workspace = true }
alloy-rpc-types      = { workspace = true }
alloy-signer-local   = { workspace = true }
alloy-consensus      = { workspace = true, features = ["k256"] }

# bitcoin-wallet-core for SpkiPin (T6c wiring — design §3.1, §5.1, §9).
bitcoin-wallet-core  = { workspace = true }

# `url` for parsing `--rpc-url` (T6c open_provider). alloy's Http transport
# accepts `url::Url`; reqwest also re-exports it. Direct dep for explicit
# type clarity (the `reqwest` transitive pulls `url` but isn't in our
# direct deps).
url                  = "2.5"

# `directories` for default wallet data dir resolution (XDG on Linux,
# platform-equivalent elsewhere). Used by `main.rs::default_data_dir()`
# when `--data-dir` is not provided on the CLI.
directories          = { workspace = true }

# `serde_json` for the `wallet list --json` formatter (T6c2 follow-up).
serde_json           = { workspace = true }
# T6d-1 (Issue #426): `serde` direct dep for `FeeEstimate`'s
# `#[derive(Serialize)]` (the `serde_json` re-export covers `to_string`
# but not the derive macro).
serde                = { workspace = true }

# `uuid` for `wallet_delete --id <UUID>` parsing (T6c3). Wallet IDs are
# UUIDs per WalletManager convention (PR #424 Phase 1 wallet storage).
uuid                 = { workspace = true }

# T6c4: `Zeroizing<Vec<u8>>` parameter for `wallet_create` +
# `wallet_import` (L54 env-var-secret defense-in-depth — caller
# passes the password already wrapped in Zeroizing; the heap copy
# gets overwritten on drop).
zeroize              = { workspace = true }

[dev-dependencies]
# T6c4 tests: `tempfile::tempdir()` for hermetic wallet-store fixtures
# (mirrors `evm-wallet-core/src/wallet.rs:845`). Pinned at 3.x; the
# workspace's existing `tempfile` constraint (if any) takes precedence.
tempfile             = "3"
# Issue #438 (T7 prep) — spawn a local Anvil node in-process so the
# polygon wallet scenario can run end-to-end against a deterministic
# chain. Pinned to the same `=1.8.3` as `alloy-provider` to avoid
# pulling a second alloy version into the dep graph. Mirror of
# `crates/evm-wallet-core/Cargo.toml` `[dev-dependencies]`.
alloy-node-bindings  = { version = "=1.8.3" }
# Same workspace-pinned alloy + reqwest for the in-test
# `ProviderBuilder::connect_http` / `raw_request` plumbing
# (`anvil_setBalance` to fund the freshly-created wallet).
alloy-provider       = { workspace = true }
alloy-transport-http = { workspace = true }
reqwest              = { workspace = true }
# serde_json for parsing `<uuid>.meta.json` after `wallet_create`.
serde_json           = { workspace = true }
# tokio test runtime (the integration test fns are `#[tokio::test]`).
tokio                = { workspace = true, features = ["macros", "rt-multi-thread"] }
