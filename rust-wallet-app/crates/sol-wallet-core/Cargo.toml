[package]
name = "sol-wallet-core"
description = "Solana wallet engine — Anza SDK re-exports + Phantom-equivalent Wallet API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# repository.workspace = true  # uncomment if workspace.repository set

[features]
default = []

# Phase 0 ships rlib only. Phase 8 (FFI cdylib) appends "cdylib" to this
# list; the rust-sol-core-ci.yml `rust-ffi-cdylib` job is guarded on the
# `cdylib` literal appearing here, so the order matters — Phase 8 is
# the first PR that flips the job from `skipping` to actually building.
[lib]
crate-type = ["rlib"]

# Phase 0 keeps the lib dep-free so the empty module stubs compile. The
# Anza SDK + SPL + ed25519-bip32 + crypto deps live in workspace.dependencies
# (Cargo.toml at the umbrella) and are wired here in Phase 1, once
# `cargo tree` has surfaced a compatible exact-pin set (plan §Task 0.1
# Step 6 deferred to Phase 1 — see CHANGELOG.md entry "Phase 0 — 2026-09-10"
# for the pin-drift rationale).
#
# Phase 1 — Anza SDK + ed25519-bip32 + bip39 (Wallet keypair, HD via SLIP-0010).
# Phase 2 — base58 / curve helpers (no new workspace deps).
# Phase 3 — system_instruction + Compute Budget (modern Anza split).
# Phase 4 — SPL crates.
# Phase 5 — tokio / reqwest / rustls / webpki / x509-parser.
# Phase 6 — argon2 / aes-gcm / chrono / uuid / serde_json.
[dependencies]
thiserror = { workspace = true }
# Phase 1.1 minimum set:
#   solana-sdk    — umbrella crate; pulls keypair + signer + transaction +
#                   instruction + message + program transitively at the
#                   exact-pinned 4.1.0 ABI the v0.1 threat model tests against.
#   ed25519-bip32 — SLIP-0010 Ed25519 HD derivation (Phantom-compatible path).
#   bip39         — English wordlist + PBKDF2-HMAC-SHA512 master seed; reused
#                   from the workspace entry (already has `zeroize` + `rand`).
#   zeroize       — wraps seed + xprv bytes during derivation so ZeroizeOnDrop
#                   fires before the Keypair consumes them (F53, U3).
#   hmac, sha2    — BIP-32 master-node + seed-stretch primitives that
#                   ed25519-bip32 exposes indirectly; declared so the feature
#                   flags line up with the Anza SDK's expectations.
solana-sdk     = { workspace = true }
ed25519-bip32  = { workspace = true }
bip39          = { workspace = true }
zeroize        = { workspace = true }
hmac           = { workspace = true }
sha2           = { workspace = true }
bs58           = { workspace = true }
# Phase 3 — `system_instruction::transfer` is in `solana-system-interface`
# in the modern Anza split; `ComputeBudgetInstruction` lives in
# `solana-compute-budget-interface`. Both declared directly so the
# builder does not depend on `solana-program` pulling them transitively
# (`solana-program` 4.1.0 documents ComputeBudgetInstruction but does
# not declare the dep — see workspace Cargo.toml comment).
solana-system-interface         = { workspace = true }
solana-compute-budget-interface = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
# Phase 3 — `bincode` 1.3.3 is already transitive via `solana-sdk`;
# declare directly so `tests/tx_serde.rs` can serialize `Message` values
# without relying on the transitive re-export. Exact-pin matches what
# Anza 4.1.0 pulls.
bincode = "=1.3.3"
