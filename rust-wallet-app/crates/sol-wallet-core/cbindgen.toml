# cbindgen configuration — Phase 8.2 Step 3 / audit M15.
#
# Emits `sol_wallet_core.h` matching Dart/Swift/Kotlin FFI consumer
# expectations. See deep-dive §K L1864-1890 for the C ABI signatures.

language = "C"
header = """/* sol_wallet_core.h — auto-generated by cbindgen. DO NOT EDIT. */
#ifndef SOL_WALLET_CORE_H
#define SOL_WALLET_CORE_H

#include <stdarg.h>
#include <stdbool.h>
#include <stdint.h>
#include <stdlib.h>

/* Buffer-size constants — mobile consumer allocates via these. */
#define SOL_WALLET_MNEMONIC_BUF_LEN 256
#define SOL_WALLET_SECRET_LEN      32
#define SOL_WALLET_PUBKEY_LEN      44
#define SOL_WALLET_SIGNATURE_LEN   64
#define SOL_WALLET_HASH_LEN        32

#ifdef __cplusplus
extern "C" {
#endif
"""

trailer = """
#ifdef __cplusplus
}
#endif

#endif /* SOL_WALLET_CORE_H */
"""

# Match the symbols exported via #[unsafe(no_mangle)] in src/ffi.rs.
# The 12 original exports from plan Task 8.1 Steps 2-11 + 4 new from
# audit H3 (zeroize), H5 (set_policy, get_policy), M16 (default_cluster).
[export]
prefix = "sol_wallet_"

[export.rename]
"SolWalletId" = "WalletId"
