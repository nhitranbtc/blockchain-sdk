[graph]
all-features = true

[advisories]
version = 2
# bincode 1.x is unmaintained; bdk_file_store 0.22.0 pins it. No safe upgrade
# in current dep tree. Track upstream for bdk_file_store bincode-2 bump.
# rustls-pemfile 2.x is unmaintained (transitive via rustls-native-certs →
# bitcoin-wallet-core). Advisory says "no safe upgrade"; migration to
# rustls-pki-types is a separate change. Track upstream rustls.
#
# rustls-webpki 0.101.7 (RUSTSEC-2026-0098/0099/0104): name-constraint + CRL
# parsing advisories. Transitive via bitcoind 0.36.1 → jsonrpc → rustls.
# Dev-dep only (bitcoind testcontainer). Upgrade path: bump bitcoind or
# `cargo update -p rustls-webpki --precise 0.103.13` once upstream settles.
#
# tokio-tar 0.3.1 (RUSTSEC-2025-0111): PAX extended-header smuggling. Transitive
# via testcontainers 0.23.3. Maintainer archived the crate; no safe upgrade.
# Switch to `astral-tokio-tar` (per upstream recommendation) when testcontainers
# publishes a release that pulls it. Dev-dep only (testcontainers).
#
# paste 1.0.15 (RUSTSEC-2024-0436): unmaintained proc-macro. Transitive via
# alloy-primitives 1.6.1 → alloy-chains → alloy-hardforks → alloy-node-bindings
# (eth-wallet-core dev-deps). No direct upgrade path; track upstream alloy
# for paste-2 migration once it lands in a stable release.
#
# libsecp256k1 0.7.2 (RUSTSEC-2025-0161): unmaintained; maintainer
# recommends k256. Transitive via anychain-tron 0.2.14 +
# anychain-kms 0.1.23 (entered tree in 2026-09-05 Tron Phase 0).
# No safe upgrade until upstream anychain migrates to k256.
#
# encoding 0.2.33 (RUSTSEC-2021-0153): unmaintained since 2016.
# Transitive via anychain-kms 0.1.23. No safe upgrade; track anychain
# for replacement crate.
ignore = [
    "RUSTSEC-2025-0141", "RUSTSEC-2025-0134",
    "RUSTSEC-2026-0098", "RUSTSEC-2026-0099", "RUSTSEC-2026-0104",
    "RUSTSEC-2025-0111",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0161",
    "RUSTSEC-2021-0153",
]

[licenses]
# BSD-2-Clause added (2026-09-05) for arrayref 0.3.9 transitive via
# libsecp256k1 0.7.2 -> anychain-kms 0.1.23 / anychain-tron 0.2.14.
# OSI approved, FSF free. No safe upgrade until upstream anychain swaps
# libsecp256k1 for a maintained ECDSA crate.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Unicode-3.0", "MIT-0", "MITNFA", "CC0-1.0", "CDLA-Permissive-2.0", "Zlib", "OpenSSL", "MPL-2.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
