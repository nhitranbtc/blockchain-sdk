services:
  bitcoind:
    image: bitcoin/bitcoin:25
    container_name: e2e-bitcoind-regtest
    command:
      - -regtest
      - -rpcuser=foo
      - -rpcpassword=bar
      - -rpcallowip=0.0.0.0/0
      - -fallbackfee=0.0002
      - -printtoconsole
    ports:
      - "18443:18443"
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=foo", "-rpcpassword=bar", "getblockchaininfo"]
      interval: 3s
      timeout: 3s
      retries: 30

  esplora:
    build:
      context: .
      dockerfile: Dockerfile.esplora-regtest
    image: e2e-esplora-regtest:local
    container_name: e2e-esplora-regtest
    depends_on:
      bitcoind:
        condition: service_healthy
    environment:
      # Defaults baked into Dockerfile.esplora-regtest. Overrides here for
      # per-stack divergence. Two processes inside the container:
      #   - electrs binds 127.0.0.1:50002 (loopback only; internal routing)
      #   - shim binds 0.0.0.0:50001 (the externally-exposed Esplora HTTP port)
      # The shim translates Esplora HTTP requests into Electrum-protocol
      # calls against electrs on 127.0.0.1:50002.
      BITCOIND_RPC_HOST: "bitcoind"
      BITCOIND_RPC_PORT: "18443"
      BITCOIND_RPC_USER: "foo"
      BITCOIND_RPC_PASS: "bar"
      ELECTRS_RPC_ADDR: "127.0.0.1:50002"
      ELECTRS_HOST: "127.0.0.1"
      ELECTRS_PORT: "50002"
    volumes:
      - esplora-regtest-db:/var/lib/electrs/db
    ports:
      - "50001:50001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:50001/regtest/api/blocks/tip/height || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s

volumes:
  esplora-regtest-db: