services:
  bitcoind:
    image: bitcoin/bitcoin:25
    container_name: e2e-bitcoind-regtest
    command:
      - -regtest
      - -rpcuser=foo
      - -rpcpassword=bar
      - -rpcallowip=0.0.0.0/0
      - -fallbackfee=0.0002
      - -printtoconsole
    ports:
      - "18443:18443"
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=foo", "-rpcpassword=bar", "getblockchaininfo"]
      interval: 3s
      timeout: 3s
      retries: 30

  esplora:
    image: blockstream/esplora:latest
    container_name: e2e-esplora-regtest
    depends_on:
      bitcoind:
        condition: service_healthy
    environment:
      # Blockstream Esplora env vars (verified against blockstream/esplora:latest).
      # bitcoind is reachable as 'bitcoind' on the Docker network
      # (esplora -> bitcoind via the bridge).
      DAEMON_RPC_ADDR: "bitcoind:18443"
      DAEMON_RPC_USER: "foo"
      DAEMON_RPC_PASS: "bar"
      ELECTRS_NETWORK: "regtest"
      ELECTRS_HTTP_PORT: "50001"
      HTTP_PORT: "50001"
    ports:
      - "50001:50001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:50001/regtest/api/blocks/tip/height || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s