[package]
name = "tron-v1-spike"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

# Spike V1–V11 + trc20_local/trc20_nile + cli_coverage — tests-only crate (Task 7.13).
# All assertions exercise the shipped `tron` CLI binary via assert_cmd
# (`rust-wallet-app/crates/tron/`). No src/ library — drift between spike impl
# and shipped impl surfaces as a test failure, not a parallel implementation.
#
# Per Phase 7 invariant: spike tests may not import from `tron_v1_spike`,
# `tron_wallet_core`, or `anychain_*` — every assertion is on CLI stdout/stderr/exit-code.

[dev-dependencies]
# CLI test harness — spawns the shipped `tron` binary and asserts on output.
assert_cmd = "2"
predicates = "3"

# Make `assert_cmd::cargo_bin("tron")` resolve under spike-only `cargo test`.
# Cargo sets `CARGO_BIN_EXE_tron` only when the binary crate is in the test
# build graph — without this dev-dep, the spike test compilation can't see
# the `tron` binary and `cargo_bin("tron")` panics with
# `CARGO_BIN_EXE_tron is unset`. Workspace already declares `tron` at root
# (`rust-wallet-app/Cargo.toml:40`) for exactly this purpose — wire it via
# the workspace alias.
#
# The Plan §Phase 7 §7.13 invariant ("tests may not import from
# tron_v1_spike / tron_wallet_core / anychain_*") still holds: adding
# `tron` as a dev-dep exposes BOTH the lib and bin targets, but
# `cargo_bin` only resolves the bin; spike tests never write
# `use tron::…`. The invariant check
# `grep 'tron_wallet_core\|anychain_\|tron_v1_spike'` stays green.
tron = { workspace = true }

# Predicate combinators used in test stderr assertions (e.g., v11's
# pre-check audit predicate chain that asserts the CLI's failure message
# contains "recipient" OR "operator" OR "self" OR "pre-check" OR "audit").
# Cheap to add; alternative is to write a manual substring scan in Rust,
# but `predicates` is the canonical assert_cmd ecosystem.

# JSON parsing for CLI stdout (TRC-20 matrix rows parse `{balance, txid, ...}`).
serde_json = { workspace = true }

# `serde` derive for the nile.json registry deserialization helpers in
# `tests/cli_coverage.rs` (`#[derive(Deserialize)]` on NileConfig /
# NileToken / NileTest). Already transitively available via serde_json
# at runtime, but the derive macro needs the direct dep in scope.
serde = { workspace = true }

# HTTP client used by trc20_local/nile rows that hit TronBox / Nile directly
# (CLI also drives those, but a few assertions cross-check the same endpoint
# to catch CLI/server divergence).
reqwest = { workspace = true, features = ["blocking"] }

# Local TRON devnet via testcontainers + tronbox/tre for `RUN_TRON_LOCAL=1`
# rows in `trc20_local` (Phase 4 §4.1 TronBox fixture).
testcontainers = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Per-test isolated `XDG_CONFIG_HOME` for wallet + config tests (Task 7.16
# cli_coverage.rs). Each test gets a tempfile::TempDir so the operator's
# real config is never modified.
tempfile = "3"

# Offline helper crates used by CLI-driven test bodies (Task 7.15 rows 2,
# 3, 4, 6 decode call-data hex + base58check T-addresses). These were
# previously in [dependencies] under the deleted src/ library; the
# tests-only crate still needs them for offline assertion helpers.
hex = { workspace = true }
bs58 = { workspace = true }
sha2 = { workspace = true }

# SPKI pin derivation from a live TLS handshake (row_1 / row_2 / row_4 use
# the computed pin to fail loud on cert rotation, instead of hardcoding).
x509-parser = { workspace = true }

# `tests/common/mod.rs::nile_sender_keypair()` returns a `Zeroizing<[u8; 32]>`.
# The spike test bodies never call this helper (they only invoke the
# shipped `tron` CLI), but the `#[path]` mod still resolves its return type
# at compile time.
zeroize = { workspace = true }

# Phase 7 — `tests/common/mod.rs` is `#[path]`-loaded from
# `crates/tron-wallet-core/tests/common/mod.rs`. That module references
# `tron_wallet_core::config::Network`, `tokens::TestAddresses`, etc. for
# typed registry accessors + network RPC URLs + SPKI pin helpers.
# The invariant "tests may not import from tron_wallet_core" still holds
# at the test-body level (spike test bodies still only assert on CLI
# stdout/stderr/exit-code); only the shared helpers reach into the lib.
tron-wallet-core = { workspace = true }

[[test]]
name = "v1_compile"
path = "tests/v1_compile.rs"

[[test]]
name = "v2_protobuf_roundtrip"
path = "tests/v2_protobuf_roundtrip.rs"

[[test]]
name = "v3_trc20_abi"
path = "tests/v3_trc20_abi.rs"

[[test]]
name = "v4_base58check"
path = "tests/v4_base58check.rs"

[[test]]
name = "v5_resource"
path = "tests/v5_resource.rs"

[[test]]
name = "v6_nile"
path = "tests/v6_nile.rs"

[[test]]
name = "v7_spki_pin"
path = "tests/v7_spki_pin.rs"

[[test]]
name = "v8_sign_only"
path = "tests/v8_sign_only.rs"

[[test]]
name = "v9_token_registry"
path = "tests/v9_token_registry.rs"

[[test]]
name = "v10_slip44"
path = "tests/v10_slip44.rs"

# V11 mainnet self-send gate (Q4 — BLOCKING for v0.1 release).
# Operator-driven via RUN_TRON_MAINNET=1 + TRON_MAINNET_OPERATOR_WALLET.
# Pre-check audit hook (recipient == operator) is exercised via the CLI
# in v11_pre_check_blocks_non_self_recipient (non-gated).
# TODO(v0.3): re-enable v11_mainnet_self_send — requires real mainnet-funded
# operator wallet + CLI integration test harness that doesn't share state with
# other tests. v0.1 ship gate currently relies on BLOCKING pre-check audit
# covered by v11_pre_check_blocks_non_self_recipient (auto-discovered +
# running un-ignored in default cargo test, so the audit is exercised).
# `test = false` excludes it from `cargo test` / `cargo nextest` unless
# explicitly forced via `--test v11_mainnet_self_send`.
[[test]]
name = "v11_mainnet_self_send"
path = "tests/v11_mainnet_self_send.rs"
test = false

# TRC-20 CLI matrix mirroring crates/tron-wallet-core/tests/trc20_*.rs (Task 7.15).
# Every row invokes `tron` CLI; no in-process library call.
[[test]]
name = "trc20_local"
path = "tests/trc20_local.rs"

[[test]]
name = "trc20_nile"
path = "tests/trc20_nile.rs"

# Per-command CLI surface coverage matrix — 19 tests driving every one of the
# 22 shipped CLI subcommands via assert_cmd::Command::cargo_bin("tron") (Task 7.16).
[[test]]
name = "cli_coverage"
path = "tests/cli_coverage.rs"
